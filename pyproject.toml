[project]
name = "swedish-tech-skill-observatory"
version = "0.1.0"
description = "Project scaffold for dlt + dbt + Dagster + MLflow + FastAPI + Streamlit."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "dagster>=1.12.0",
    "dagster-webserver>=1.12.0",
    "dbt-duckdb>=1.9.0",
    "dlt[duckdb]>=1.27.2",
    "duckdb>=1.5.3",
    "minio>=7.2.20",
    "pandas>=2.3.0",
    "requests>=2.34.2",
    "python-dotenv>=1.1.1",
    "streamlit>=1.58.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires local infrastructure such as MinIO",
]

[tool.ruff.lint.per-file-ignores]
"fabric/workspace/**/*.ipynb" = ["F821"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
