swedish_tech_skill_observatory:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: data/warehouse/skill_observatory.duckdb
      schema: main
      threads: 4
    minio:
      type: duckdb
      path: data/warehouse/skill_observatory.duckdb
      schema: main
      threads: 4
      extensions:
        - httpfs
        - parquet
      secrets:
        - type: s3
          provider: config
          key_id: "{{ env_var('S3_ACCESS_KEY') }}"
          secret: "{{ env_var('S3_SECRET_KEY') }}"
          region: "{{ env_var('S3_REGION', 'us-east-1') }}"
          endpoint: "{{ env_var('S3_ENDPOINT', 'localhost:9000') }}"
          url_style: path
          use_ssl: "{{ env_var('S3_USE_SSL', 'false') }}"
          scope: "s3://{{ env_var('S3_BUCKET', 'skill-observatory') }}"
